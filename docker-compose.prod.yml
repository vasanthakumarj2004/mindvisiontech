services:
  # 1. Express REST API Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mindvisiontech-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      CLIENT_URL: ${CLIENT_URL:-https://mindvisiontech.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mindvisiontech.com,https://www.mindvisiontech.com}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-mindvisiontech-assets}
      AWS_S3_BUCKET_DOMAIN: ${AWS_S3_BUCKET_DOMAIN:-mindvisiontech-assets.s3.ap-south-1.amazonaws.com}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    networks:
      - mindvisiontech-net

  # 2. Next.js Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://mindvisiontech.com/api
        NEXT_PUBLIC_SITE_URL: https://mindvisiontech.com
    container_name: mindvisiontech-client
    restart: always
    depends_on:
      - server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: https://mindvisiontech.com/api
      NEXT_PUBLIC_SITE_URL: https://mindvisiontech.com
    networks:
      - mindvisiontech-net

networks:
  mindvisiontech-net:
    driver: bridge
