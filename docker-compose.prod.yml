# ==============================================================================
# Production Docker Compose for EC2 / VPS Hosting
# Supports both Local MongoDB Container and Cloud MongoDB Atlas
# ==============================================================================
services:
  mongodb:
    image: mongo:7.0
    container_name: mindvisiontech-mongodb-prod
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-mindvision_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mindvision_prod_pass}
      MONGO_INITDB_DATABASE: mindvisiontech
    volumes:
      - mindvisiontech-mongodb-data:/data/db
    networks:
      - internal-net
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mindvisiontech-api:latest
    container_name: mindvisiontech-api-prod
    restart: unless-stopped
    ports:
      # Bound strictly to 127.0.0.1 to force all public traffic through NGINX with SSL/ALB
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Uses MONGODB_URI if set (e.g. MongoDB Atlas), otherwise falls back to local container
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-mindvision_admin}:${MONGO_ROOT_PASSWORD:-mindvision_prod_pass}@mongodb:27017/mindvisiontech?authSource=admin}
      CLIENT_URL: ${CLIENT_URL:-https://mindvisiontech.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mindvisiontech.com,https://www.mindvisiontech.com}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    networks:
      - internal-net

volumes:
  mindvisiontech-mongodb-data:
    name: mindvisiontech_persistent_mongo_data

