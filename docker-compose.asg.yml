# ==============================================================================
# MindVisionTech Stateless API Docker Compose (For Auto Scaling Group Nodes)
# Designed to connect to external MongoDB (e.g., MongoDB Atlas M0 Free Tier)
# ==============================================================================
services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mindvisiontech-api:latest
    container_name: mindvisiontech-api-asg
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1:5000 (fronted by local NGINX or ALB)
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI pointing to MongoDB Atlas or external cluster is required}
      CLIENT_URL: ${CLIENT_URL:-https://mindvisiontech.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mindvisiontech.com,https://www.mindvisiontech.com}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
