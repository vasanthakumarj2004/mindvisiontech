# ==============================================================================
# MindVisionTech High-Performance Production NGINX Reverse Proxy
# Path: /etc/nginx/sites-available/mindvisiontech
# Supports: Direct EC2 with Let's Encrypt OR EC2 behind AWS Application Load Balancer
# ==============================================================================

# Rate limiting zone (10 requests per second per IP with 20 burst capacity)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

upstream express_backend {
    server 127.0.0.1:5000;
    keepalive 32; # Keep-alive connections to Node.js upstream to reduce handshake latency
}

# ------------------------------------------------------------------------------
# HTTP (Port 80)
# Handles: ACME SSL challenges, ALB Health Checks, and HTTPS redirection
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.mindvisiontech.com _;

    # 1. Let's Encrypt ACME challenge (MUST be served over HTTP port 80)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 2. ALB Target Group & Internal Health Check (MUST return 200 OK, NEVER 301!)
    location = /api/health {
        proxy_pass http://express_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # 3. Handle Traffic forwarded from ALB (ALB terminates SSL and forwards to Port 80)
    # If request was already HTTPS at the ALB, proxy directly to Express
    location / {
        # Check if forwarded by an SSL-terminating Load Balancer
        if ($http_x_forwarded_proto = "https") {
            proxy_pass http://express_backend;
            break;
        }

        # Direct HTTP connection without ALB SSL -> redirect to HTTPS
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) - High Performance SSL & Proxy (Direct EC2 / Let's Encrypt)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name api.mindvisiontech.com;

    # SSL Certificates (managed automatically by Certbot / self-signed bootstrap)
    ssl_certificate /etc/letsencrypt/live/api.mindvisiontech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mindvisiontech.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m; # Cache SSL sessions to minimize TLS handshakes
    ssl_session_tickets off;

    # Modern High-Security TLS Configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Compression (Gzip) for faster API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Client payload limitations (Anti-DoS)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    send_timeout 10;

    # API Health Check Endpoint (Bypasses rate limiting for monitoring checks)
    location = /api/health {
        proxy_pass http://express_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # API Reverse Proxy
    location / {
        # Rate Limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr_limit 10;

        proxy_pass http://express_backend;
        proxy_http_version 1.1;

        # Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Real Client IP propagation for rate limiting and auditing
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering & Performance Tuning
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
