# ==============================================================================
# MindVisionTech Single EC2 NGINX Configuration (Frontend + API + Reverse Proxy)
# Path: /etc/nginx/sites-available/mindvisiontech
# ==============================================================================

# 1. Main Website: mindvisiontech.com, www, and Direct EC2 Public IP
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mindvisiontech.com www.mindvisiontech.com _;

    root /var/www/mindvisiontech/out;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Reverse Proxy API requests to Express container
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Serve Next.js static pages with fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# 2. Dedicated API Subdomain: api.mindvisiontech.com
server {
    listen 80;
    listen [::]:80;
    server_name api.mindvisiontech.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
