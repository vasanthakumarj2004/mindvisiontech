# ==============================================================================
# MindVisionTech Single EC2 NGINX Configuration (Frontend + API + Certbot SSL)
# Path: /etc/nginx/sites-available/mindvisiontech
# Replaces AWS ALB with Direct NGINX TLS 1.3 Termination & Certbot Let's Encrypt
# ==============================================================================

# Rate limiting zone (10 requests per second per IP with 20 burst capacity)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# Upstream Node.js Express backend container
upstream express_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP (Port 80): ACME Challenge & Automatic HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mindvisiontech.com www.mindvisiontech.com api.mindvisiontech.com _;

    # Certbot Let's Encrypt ACME verification (served unredirected on port 80)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Internal health check for monitoring / local curls without SSL
    location = /api/health {
        proxy_pass http://express_api/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # Redirect all other HTTP traffic to HTTPS (301 Permanent Redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS (Port 443): Main Website (mindvisiontech.com & www)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name mindvisiontech.com www.mindvisiontech.com;

    # SSL Certificates (managed automatically by Certbot / bootstrap fallback)
    ssl_certificate /etc/letsencrypt/live/mindvisiontech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindvisiontech.com/privkey.pem;

    # Modern High-Security TLS Configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression (Gzip) for static files and API payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static Frontend Root (Next.js pre-rendered HTML export)
    root /var/www/mindvisiontech/out;
    index index.html;

    # Reverse Proxy API requests to Express container
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr_limit 10;

        proxy_pass http://express_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Serve Next.js static pages with fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache static assets (CSS, JS, Images, Fonts) for 30 days
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ------------------------------------------------------------------------------
# 3. HTTPS (Port 443): Dedicated Subdomain (api.mindvisiontech.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mindvisiontech.com;

    ssl_certificate /etc/letsencrypt/live/mindvisiontech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindvisiontech.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr_limit 10;

        proxy_pass http://express_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
