name: Production Deployment (EC2 Single-Instance)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Automated Test Verification
  # ----------------------------------------------------------------------------
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Run Test Suites (Client & Server)
        run: npm test

  # ----------------------------------------------------------------------------
  # Stage 2: Deploy to EC2 via SSH (Zero-Downtime Hot Reload)
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Execute Update on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            sudo /opt/mindvisiontech/deploy/aws/update-prod.sh main
