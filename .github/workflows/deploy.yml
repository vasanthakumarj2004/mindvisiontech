name: Production Continuous Deployment (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Select component to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Automated Test Verification & Path Diff Detection
  # ----------------------------------------------------------------------------
  test:
    name: Run Automated Tests & Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Accurate path detection supporting single commits, multi-commits, and merges
      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'client/**'
              - 'package*.json'
            backend:
              - 'server/**'
              - 'deploy/**'
              - 'docker-compose*'
              - 'package*.json'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Run Test Suites
        run: npm test

  # ----------------------------------------------------------------------------
  # Stage 2: Deploy Frontend to S3 + CloudFront (Sub-60s Global Edge Update)
  # ----------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Static Frontend (S3 + CloudFront)
    needs: test
    runs-on: ubuntu-latest
    if: |
      needs.test.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'frontend')) ||
        (github.event_name == 'push' && needs.test.outputs.frontend == 'true')
      )
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Build Static Frontend
        run: |
          npm --prefix client ci
          npm --prefix client run build:static
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.mindvisiontech.com/api' }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Sync Static Assets to S3
        run: |
          aws s3 sync client/out/ s3://${{ secrets.AWS_S3_BUCKET }} --delete --cache-control "public, max-age=31536000, immutable" --exclude "*.html"
          aws s3 sync client/out/ s3://${{ secrets.AWS_S3_BUCKET }} --delete --cache-control "public, max-age=0, must-revalidate" --include "*.html"

      - name: Invalidate CloudFront Edge Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

  # ----------------------------------------------------------------------------
  # Stage 3: Deploy Backend to EC2 (Zero-Downtime Docker Hot Reload)
  # ----------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend API (EC2 Rolling Reload)
    needs: test
    runs-on: ubuntu-latest
    if: |
      needs.test.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'backend')) ||
        (github.event_name == 'push' && needs.test.outputs.backend == 'true')
      )
    steps:
      # Option 1: Direct SSH via Elastic IP (Ideal for Manual AWS Setup)
      - name: Deploy via SSH to EC2 Elastic IP
        if: "${{ secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo /opt/mindvisiontech/deploy/aws/update-prod.sh main

      # Option 2: Fallback to AWS Systems Manager (SSM) if IAM credentials are used
      - name: Configure AWS Credentials (SSM Fallback)
        if: "${{ secrets.EC2_HOST == '' || secrets.EC2_SSH_KEY == '' }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Trigger Zero-Downtime Reload via AWS Systems Manager (SSM)
        if: "${{ secrets.EC2_HOST == '' || secrets.EC2_SSH_KEY == '' }}"
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Project,Values=mindvisiontech" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo /opt/mindvisiontech/deploy/aws/update-prod.sh main"]' \
            --comment "Instant CD Deployment: Commit ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command Sent: ${COMMAND_ID}. Waiting for completion..."
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id $(aws ec2 describe-instances --filters "Name=tag:Project,Values=mindvisiontech" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "SUCCESS: Backend deployment verified and running live on production!"
